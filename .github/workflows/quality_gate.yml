name: WeeklyPulse Production Quality Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality_check:
    name: Code Analysis, Test Coverage & Native Release Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v3

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter Toolchain
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Project Dependencies
        run: flutter pub get

      - name: Verify Code Formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Run Static Code Analysis (Zero-Tolerance)
        run: flutter analyze --fatal-infos --fatal-warnings

      - name: Execute Unit & Regression Test Suite
        run: flutter test --coverage

      - name: Build Android Release APK (Verification Gate)
        run: flutter build apk --release